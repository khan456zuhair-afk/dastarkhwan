<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Elegant Islamic / Mughal Geometric Medallion Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Octagram Motif / Dastarkhwan Symbol -->
    <rect x="14" y="14" width="32" height="32" rx="4" transform="rotate(0 30 30)" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.8"/>
    <rect x="14" y="14" width="32" height="32" rx="4" transform="rotate(45 30 30)" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.8"/>
    <!-- Central Golden Flame / Spice Bloom -->
    <circle cx="30" cy="30" r="8" fill="url(#goldGrad)" opacity="0.15" />
    <path d="M30 18 C33 24 38 27 38 32 C38 36.4 34.4 40 30 40 C25.6 40 22 36.4 22 32 C22 27 27 24 30 18 Z" fill="url(#goldGrad)"/>
    <circle cx="30" cy="32" r="2.5" fill="#131315" />
    <!-- Decorative Corner Dots -->
    <circle cx="30" cy="7" r="1.5" fill="url(#goldGrad)" />
    <circle cx="30" cy="53" r="1.5" fill="url(#goldGrad)" />
    <circle cx="7" cy="30" r="1.5" fill="url(#goldGrad)" />
    <circle cx="53" cy="30" r="1.5" fill="url(#goldGrad)" />
  </g>

  <!-- Typography Brand Mark -->
  <g transform="translate(78, 20)">
    <!-- English Luxury Brand Name -->
    <text x="0" y="30" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="4" fill="url(#goldGrad)" filter="url(#subtleGlow)">DASTARKHWAN</text>
    <!-- Tagline / Subtitle -->
    <text x="3" y="46" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9.5" font-weight="500" letter-spacing="5" fill="#C5BCAE" opacity="0.9">IMPERIAL PAKISTANI CUISINE</text>
    <line x1="172" y1="43" x2="230" y2="43" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.5" />
  </g>
</svg>
